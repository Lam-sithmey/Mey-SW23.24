<h2 class="text-center text-info mt-4">WELCOME TO CONTACT US PAGE</h2>
<div class="container col-4">
  <div class="row justify-content-center align-items-center">

    <form (ngSubmit)="saveData()">
      <div class="form-group mt-2">
        <label for="fullname">Fullname :</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
          <input type="text" name="fullname" [(ngModel)]="contact.fullname" class="form-control"
            placeholder="Enter your fullname">
        </div>
      </div>
      <div class="form-group mt-2">
        <label for="email">Email :</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" [(ngModel)]="contact.email" class="form-control "
            placeholder="Enter Your Email">
        </div>
      </div>
      <div class="form-group mt-2">
        <label for="number">Phone :</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone-fill"></i></span>
          <input type="number" name="number" [(ngModel)]="contact.phone" class="form-control"
            placeholder="Enter Your Phone">
        </div>
      </div>
      <div class="form-group mt-2">
        <label for="text">Message :</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-chat-fill"></i></span>
          <textarea name="message" [(ngModel)]="contact.message" class="form-control"
            placeholder="Enter Your Message"></textarea>
        </div>
      </div>
      <div class="form-group mt-2">
        
        <button class="btn btn-primary"> <i class="bi bi-send  me-3"></i>
          {{editindex===-1 ? 'Send To' : 'Update Contact'}}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Result -->
<div class="container mt-4" *ngIf="contacts.length > 0">
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let item of contacts; let i=index ">
      <div class="card border-success shadow-sm">
        <div class="card-body">
          <h4 class="text-success">{{ item.fullname }}</h4>
          <p><i class="bi bi-envelope-at-fill me-3 h4  text-primary "></i> {{ item.email }}</p>
          <p><i class="bi bi-telephone-fill me-3 h4  text-danger"></i> {{ item.phone }}</p>
          <p><i class="bi bi-chat-quote-fill me-3 h4  text-info"></i> {{ item.message }}</p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between">
          <button class="btn btn-outline-success " (click)="editContact(i)"> <i class="bi bi-pencil-square me-3 "></i>
            
            editContact</button>

          <button class="btn btn-outline-danger" (click)="deleteContact(i)"> <i class="bi bi-trash3-fill me-3"></i>Delete</button>

        </div>
      </div>
    </div>
  </div>
</div>
