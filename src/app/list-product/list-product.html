<div class="container">
    <h2 class="h2 text-center text-primary">list Product Information</h2>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>PRODUCT ID</th>
                    <th>IMAGES</th>
                    <th>TITLE</th>
                    <th>CATEGORY</th>
                    <th>BRAND</th>
                    <th>RATING</th>
                    <th>STOCK</th>
                    <th>PRICE($)</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of pageinatedProducts">
                    <td>{{item.id}}</td>
                    <td><img [src]="item.thumbnail" width="70" height="70" alt=""></td>
                    <td>{{item.title}}</td>
                    <td>{{item.category}}</td>
                    <td>{{item.brand}}</td>
                    <td>{{item.rating}}</td>
                    <td>${{item.price}}</td>
                    <td>${{item.stock}} Unit</td>
                    <td>
                        <button class="btn btn-warning me-2"><i class="bi bi-pencil-square me-2"></i> Edit</button>
                        <button class="btn btn-danger"><i class="bi bi-trash-fill me-2"></i>Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-center align-items-center mt-4">

    <button
        class="btn btn-outline-primary me-2"
        (click)="firstPage()"
        [disabled]="currentPage === 1">
        <i class="bi bi-chevron-double-left"></i>
        First
    </button>

    <button
        class="btn btn-outline-secondary me-3"
        (click)="previousPage()"
        [disabled]="currentPage === 1">
        <i class="bi bi-chevron-left"></i>
        Previous
    </button>

    <span class="fw-bold fs-5">
        Page {{ currentPage }} of {{ totalPages }}
    </span>

    <button
        class="btn btn-outline-secondary ms-3 me-2"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages">
        Next
        <i class="bi bi-chevron-right"></i>
    </button>

    <button
        class="btn btn-outline-primary"
        (click)="lastPage()"
        [disabled]="currentPage === totalPages">
        Last
        <i class="bi bi-chevron-double-right"></i>
    </button>

</div>

</div>
